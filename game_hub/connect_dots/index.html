<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🎨 绘画板 - Game Hub</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body{display:flex;flex-direction:column;user-select:none}
        .game-wrapper{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px}
        .tools{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
        .tools button{background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);
            padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit}
        .tools button:hover{background:rgba(102,126,234,0.3);color:#fff}
        .tools button.active{background:rgba(102,126,234,0.5);color:#fff;border-color:#667eea}
        .color-pick{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);cursor:pointer}
        .color-pick.active{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,0.4)}
        input[type=range]{width:80px}
        span{color:#aaa;font-size:13px}
        canvas{border:2px solid rgba(255,255,255,0.12);border-radius:8px;background:#FFF;cursor:crosshair}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back">← 返回首页</a>
        <span class="logo">🎨 绘画板</span>
    </nav>
    <div class="game-wrapper">
        <div class="tools">
            <span>画笔</span>
            <input type="range" id="brushSize" min="1" max="30" value="4" oninput="brushSize=this.value">
            <span id="sizeLabel">4px</span>
            <span>|</span>
            <button onclick="setColor('#000')" class="color-pick active" id="c-black" style="background:#000"></button>
            <button onclick="setColor('#E04040')" class="color-pick" id="c-red" style="background:#E04040"></button>
            <button onclick="setColor('#FF8C00')" class="color-pick" id="c-orange" style="background:#FF8C00"></button>
            <button onclick="setColor('#4ECDC4')" class="color-pick" id="c-teal" style="background:#4ECDC4"></button>
            <button onclick="setColor('#667eea')" class="color-pick" id="c-blue" style="background:#667eea"></button>
            <button onclick="setColor('#A78BFA')" class="color-pick" id="c-purple" style="background:#A78BFA"></button>
            <button onclick="setColor('#34D399')" class="color-pick" id="c-green" style="background:#34D399"></button>
            <span>|</span>
            <button onclick="setEraser()" id="btn-eraser">🧹 橡皮</button>
            <button onclick="clearCanvas()">🗑 清空</button>
            <button onclick="undoStroke()">↩ 撤销</button>
            <button onclick="saveImage()">💾 保存</button>
        </div>
        <canvas id="game" width="680" height="460"></canvas>
    </div>
    <footer class="footer">按住鼠标画线 &nbsp;|&nbsp; 支持触摸屏 &nbsp;|&nbsp; Game Hub</footer>
    <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
    let drawing=false, brushSize=4, brushColor="#000", isEraser=false;
    let strokes=[], currentStroke=null;

    // 白色背景
    ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);

    function setColor(c){
        isEraser=false;brushColor=c;
        document.getElementById("btn-eraser").classList.remove("active");
        document.querySelectorAll(".color-pick").forEach(b=>b.classList.remove("active"));
        document.getElementById("c-"+{["#000"]:"black",["#E04040"]:"red",["#FF8C00"]:"orange",["#4ECDC4"]:"teal",["#667eea"]:"blue",["#A78BFA"]:"purple",["#34D399"]:"green"}[c]).classList.add("active");
    }

    function setEraser(){
        isEraser=true;
        document.getElementById("btn-eraser").classList.add("active");
        document.querySelectorAll(".color-pick").forEach(b=>b.classList.remove("active"));
    }

    function clearCanvas(){
        ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);strokes=[];
    }

    function undoStroke(){
        strokes.pop();
        redrawAll();
    }

    function redrawAll(){
        ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);
        for(let s of strokes){
            if(s.points.length<2)continue;
            ctx.strokeStyle=s.color;ctx.lineWidth=s.size;
            ctx.lineCap="round";ctx.lineJoin="round";
            ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
            for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
            ctx.stroke();
        }
    }

    function saveImage(){
        let link=document.createElement("a");
        link.download="我的画.png";
        link.href=canvas.toDataURL();
        link.click();
    }

    function getPos(e){
        let rect=canvas.getBoundingClientRect();
        return{x:e.clientX-rect.left,y:e.clientY-rect.top};
    }

    canvas.addEventListener("mousedown",e=>{
        drawing=true;
        let p=getPos(e);
        currentStroke={points:[p],color:isEraser?"#FFF":brushColor,size:isEraser?brushSize*3:brushSize};
        strokes.push(currentStroke);
    });

    canvas.addEventListener("mousemove",e=>{
        if(!drawing)return;
        let p=getPos(e);
        currentStroke.points.push(p);
        // 平滑绘制
        let pts=currentStroke.points;
        if(pts.length<2)return;
        ctx.strokeStyle=currentStroke.color;
        ctx.lineWidth=currentStroke.size;
        ctx.lineCap="round";ctx.lineJoin="round";
        ctx.beginPath();ctx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);
        ctx.lineTo(p.x,p.y);ctx.stroke();
    });

    canvas.addEventListener("mouseup",()=>{drawing=false});
    canvas.addEventListener("mouseleave",()=>{drawing=false});

    // 触摸支持
    canvas.addEventListener("touchstart",e=>{e.preventDefault();drawing=true;
        let t=e.touches[0],p=getPos(t);
        currentStroke={points:[p],color:isEraser?"#FFF":brushColor,size:isEraser?brushSize*3:brushSize};
        strokes.push(currentStroke);
    });
    canvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing)return;
        let t=e.touches[0],p=getPos(t);
        currentStroke.points.push(p);
        let pts=currentStroke.points;
        if(pts.length<2)return;
        ctx.strokeStyle=currentStroke.color;ctx.lineWidth=currentStroke.size;
        ctx.lineCap="round";ctx.lineJoin="round";
        ctx.beginPath();ctx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);
        ctx.lineTo(p.x,p.y);ctx.stroke();
    });
    canvas.addEventListener("touchend",()=>{drawing=false});

    // 画笔大小显示
    document.getElementById("brushSize").addEventListener("input",function(){
        document.getElementById("sizeLabel").textContent=this.value+"px";
    });
    </script>
</body>
</html>
