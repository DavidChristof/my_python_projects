<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🔢 连线画画 - Game Hub</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body { display:flex; flex-direction:column; user-select:none; }
        .game-wrapper { flex:1; display:flex; flex-direction:column; align-items:center; }
        .toolbar { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; justify-content:center; }
        .toolbar button {
            background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);
            padding:10px 18px;border-radius:8px;cursor:pointer;font-size:18px;font-family:inherit;
        }
        .toolbar button:hover{background:rgba(102,126,234,0.3);color:#fff;}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back">← 返回首页</a>
        <span class="logo">🔢 连线画画</span>
    </nav>
    <div class="game-wrapper">
        <div class="toolbar">
            <button onclick="loadPattern('star')">⭐ 星星</button>
            <button onclick="loadPattern('house')">🏠 房子</button>
            <button onclick="loadPattern('fish')">🐟 小鱼</button>
            <button onclick="loadPattern('heart')">❤️ 爱心</button>
            <button onclick="loadPattern('rocket')">🚀 火箭</button>
        </div>
        <canvas id="game" width="440" height="440"></canvas>
    </div>
    <footer class="footer">按数字顺序点击圆点 &nbsp;|&nbsp; 完成图案有惊喜！&nbsp;|&nbsp; Game Hub</footer>
    <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
    const W=440,H=440;

    // 图案坐标（相对坐标，自动缩放居中）
    const patterns={
        star:[[0,-100],[30,-40],[100,-40],[45,10],[70,80],[0,40],[-70,80],[-45,10],[-100,-40],[-30,-40]],
        house:[[0,-90],[60,-90],[60,0],[60,60],[0,90],[-60,60],[-60,0],[-60,-90]],
        fish:[[60,-60],[80,-30],[40,-10],[40,20],[20,50],[-20,50],[-60,30],[-80,0],[-60,-30],[-20,-40],[20,-40]],
        heart:[[0,-90],[40,-60],[80,-20],[90,30],[60,70],[0,100],[-60,70],[-90,30],[-80,-20],[-40,-60]],
        rocket:[[0,-100],[25,-80],[50,-40],[30,0],[30,40],[50,80],[20,70],[-20,70],[-50,80],[-30,40],[-30,0],[-50,-40],[-25,-80]],
    };
    const patternNames={star:"星星⭐",house:"房子🏠",fish:"小鱼🐟",heart:"爱心❤️",rocket:"火箭🚀"};

    let dots=[], lines=[], current=0, complete=false, currentPattern="star";
    let confetti=[];

    const ac=new (window.AudioContext||window.webkitAudioContext)();
    function beep(f,d,t="sine",v=0.07){
        let o=ac.createOscillator(),g=ac.createGain();
        o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);
        g.gain.setValueAtTime(v,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
        o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
    }

    function loadPattern(name){
        currentPattern=name;
        let pts=patterns[name];
        // 缩放到 380 区域并居中
        let maxR=0;
        for(let [x,y] of pts) maxR=Math.max(maxR,Math.abs(x),Math.abs(y));
        let scale=180/maxR;
        dots=pts.map(([x,y],i)=>({x:W/2+x*scale, y:H/2+y*scale, num:i+1}));
        lines=[];current=0;complete=false;confetti=[];
    }

    canvas.addEventListener("click",e=>{
        if(complete){loadPattern(Object.keys(patterns)[Math.floor(Math.random()*5)]);return;}
        let rect=canvas.getBoundingClientRect();
        let mx=e.clientX-rect.left, my=e.clientY-rect.top;
        if(current<dots.length){
            let d=dots[current];
            if(Math.hypot(mx-d.x,my-d.y)<22){
                if(current>0) lines.push({from:dots[current-1],to:d});
                current++;
                beep(400+current*40,0.05,"sine",0.06);
                if(current>=dots.length){
                    complete=true;
                    setTimeout(()=>beep(880,0.15),100);
                    setTimeout(()=>beep(1100,0.12),250);
                    // 彩花
                    for(let i=0;i<60;i++){
                        let ang=Math.random()*Math.PI*2, spd=3+Math.random()*8;
                        confetti.push({x:W/2,y:H/2,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
                            color:["#FF6B6B","#4ECDC4","#FFE66D","#A78BFA","#FB923C","#34D399","#F472B6"][Math.floor(Math.random()*7)],
                            life:40+Math.random()*40});
                    }
                }
            }
        }
    });

    function draw(){
        ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,W,H);

        // 连线
        ctx.strokeStyle="#667eea";ctx.lineWidth=3;ctx.lineCap="round";
        for(let l of lines){ctx.beginPath();ctx.moveTo(l.from.x,l.from.y);ctx.lineTo(l.to.x,l.to.y);ctx.stroke();}

        // 下一个提示
        if(current>0&&current<dots.length){
            ctx.strokeStyle="rgba(102,126,234,0.3)";ctx.lineWidth=2;ctx.setLineDash([6,6]);
            ctx.beginPath();ctx.moveTo(dots[current-1].x,dots[current-1].y);
            ctx.lineTo(dots[current].x,dots[current].y);ctx.stroke();
            ctx.setLineDash([]);
        }

        // 圆点
        for(let d of dots){
            let isNext=d.num===current+1, connected=d.num<=current;
            let r=isNext?22:18;
            // 外圈发光
            if(isNext&&!complete){
                ctx.fillStyle="rgba(255,255,100,0.2)";
                ctx.beginPath();ctx.arc(d.x,d.y,r+8,0,Math.PI*2);ctx.fill();
            }
            ctx.fillStyle=connected?"#4ECDC4":"#667eea";
            ctx.beginPath();ctx.arc(d.x,d.y,r,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=2;ctx.stroke();

            // 数字
            ctx.fillStyle=connected?"#fff":"rgba(255,255,255,0.8)";
            ctx.font="bold 16px Microsoft YaHei";ctx.textAlign="center";ctx.textBaseline="middle";
            ctx.fillText(d.num,d.x,d.y);
        }

        // 彩花
        for(let c of confetti){
            ctx.fillStyle=c.color;ctx.fillRect(c.x,c.y,6,6);
        }

        // 完成提示
        if(complete){
            ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,0,W,H);
            ctx.fillStyle="#FFD700";ctx.font="bold 36px Microsoft YaHei";ctx.textAlign="center";
            ctx.fillText("🎉 太棒了！",W/2,H/2-20);
            ctx.fillStyle="#FFF";ctx.font="18px Microsoft YaHei";
            ctx.fillText("你画出了 " + patternNames[currentPattern] + "！",W/2,H/2+20);
            ctx.fillText("点击任意位置换图案",W/2,H/2+50);
        }

        // 顶部提示
        ctx.fillStyle="rgba(255,255,255,0.5)";ctx.font="15px Microsoft YaHei";ctx.textAlign="center";
        if(!complete) ctx.fillText("请点击数字 " + (current + 1), W/2, 20);
    }

    function update(){
        for(let c of confetti){c.x+=c.vx;c.y+=c.vy;c.vy+=0.15;c.life--;}
        confetti=confetti.filter(c=>c.life>0);
    }

    loadPattern("star");
    function loop(){update();draw();requestAnimationFrame(loop);}
    loop();
    </script>
</body>
</html>
