<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🧩 记忆翻牌 - Game Hub</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body{display:flex;flex-direction:column;user-select:none}
        .game-wrapper{flex:1;display:flex;flex-direction:column;align-items:center}
        .toolbar{display:flex;gap:10px;margin:10px 0;align-items:center}
        .toolbar button{background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.15);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:15px;font-family:inherit}
        .toolbar button:hover{background:rgba(102,126,234,0.3);color:#fff}
        .toolbar button.active{background:rgba(102,126,234,0.5);color:#fff;border-color:#667eea}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back">← 返回首页</a>
        <span class="logo">🧩 记忆翻牌</span>
    </nav>
    <div class="game-wrapper">
        <div class="toolbar">
            <button onclick="setDifficulty(4,4)" id="btn-easy" class="active">简单 4×4</button>
            <button onclick="setDifficulty(6,4)" id="btn-mid">中等 6×4</button>
            <button onclick="setDifficulty(6,5)" id="btn-hard">困难 6×5</button>
            <span style="color:#aaa;font-size:14px">步数: <b style="color:#FFD700" id="md">0</b></span>
        </div>
        <canvas id="game" width="640" height="560"></canvas>
    </div>
    <footer class="footer">点击卡片翻牌 &nbsp;|&nbsp; 找出所有配对 &nbsp;|&nbsp; Game Hub</footer>
    <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
    const GAP=6;
    let ROWS=4,COLS=4,CARD_W=90,CARD_H=100,BOARD_X=0,BOARD_Y=20;
    const ALL_EMOJIS=["🐶","🐱","🐸","🦊","🐻","🐼","🐨","🐯","🐮","🐷","🐵","🐰","🐙","🦁","🐥"];
    let cards=[],flipped=[],matched=new Set(),moves=0,locked=false;

    const ac=new(window.AudioContext||window.webkitAudioContext)();
    function beep(f,d,t="sine",v=0.08){
        let o=ac.createOscillator(),g=ac.createGain();
        o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);
        g.gain.setValueAtTime(v,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
        o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
    }

    function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

    function calcLayout(){
        CARD_W=Math.floor((630-COLS*(GAP+2))/COLS);
        CARD_H=CARD_W+8;
        BOARD_X=Math.floor((640-COLS*(CARD_W+GAP)+GAP)/2);
        BOARD_Y=Math.floor((560-ROWS*(CARD_H+GAP)+GAP)/2);
    }

    function init(){
        let count=ROWS*COLS/2;
        let emojis=ALL_EMOJIS.slice(0,count);
        let pairs=shuffle([...emojis,...emojis]);
        cards=[];
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
            cards.push({row:r,col:c,emoji:pairs[r*COLS+c],flipped:false});
        flipped=[];matched.clear();moves=0;locked=false;
        document.getElementById("md").textContent="0";
    }

    function setDifficulty(r,c){
        ROWS=r;COLS=c;calcLayout();init();
        document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("active"));
        document.getElementById("btn-"+(r===4?"easy":r===6&&c===4?"mid":"hard")).classList.add("active");
    }

    canvas.addEventListener("click",e=>{
        if(locked)return;
        let rect=canvas.getBoundingClientRect();
        let mx=e.clientX-rect.left,my=e.clientY-rect.top;
        for(let card of cards){
            let x=BOARD_X+card.col*(CARD_W+GAP),y=BOARD_Y+card.row*(CARD_H+GAP);
            if(mx>=x&&mx<=x+CARD_W&&my>=y&&my<=y+CARD_H&&!card.flipped&&!matched.has(card)){
                card.flipped=true;flipped.push(card);beep(520,0.05);
                if(flipped.length===2){
                    moves++;locked=true;
                    document.getElementById("md").textContent=moves;
                    let[a,b]=flipped;
                    if(a.emoji===b.emoji){
                        matched.add(a);matched.add(b);flipped=[];locked=false;beep(880,0.12);
                    }else{
                        setTimeout(()=>{a.flipped=false;b.flipped=false;flipped=[];locked=false},500);
                        setTimeout(()=>beep(200,0.1,"triangle",0.06),250);
                    }
                }
                break;
            }
        }
    });

    function draw(){
        ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,640,560);
        for(let card of cards){
            let x=BOARD_X+card.col*(CARD_W+GAP),y=BOARD_Y+card.row*(CARD_H+GAP);
            let show=card.flipped||matched.has(card);
            ctx.fillStyle=show?"#FFF":"#667eea";
            ctx.beginPath();ctx.roundRect(x,y,CARD_W,CARD_H,10);ctx.fill();
            ctx.strokeStyle=show?"#ddd":"#5568d3";ctx.lineWidth=2;
            ctx.beginPath();ctx.roundRect(x,y,CARD_W,CARD_H,10);ctx.stroke();
            if(show){
                let fs=Math.max(18,Math.floor(CARD_W*0.45));
                ctx.font=fs+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
                ctx.fillText(card.emoji,x+CARD_W/2,y+CARD_H/2+2);
            }else{
                let fs=Math.max(14,Math.floor(CARD_W*0.3));
                ctx.fillStyle="rgba(255,255,255,0.2)";ctx.font=fs+"px sans-serif";
                ctx.textAlign="center";ctx.textBaseline="middle";
                ctx.fillText("?",x+CARD_W/2,y+CARD_H/2+2);
            }
        }
        if(matched.size===ROWS*COLS){
            ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,640,560);
            ctx.fillStyle="#4F0";ctx.font="bold 36px Microsoft YaHei";ctx.textAlign="center";
            ctx.fillText("🎉 恭喜通关！",320,260);
            ctx.fillStyle="#FFF";ctx.font="20px Microsoft YaHei";
            ctx.fillText("共用 "+moves+" 步",320,300);
            ctx.fillText("点击任意位置重新开始",320,335);
        }
    }

    canvas.addEventListener("click",function(e){if(matched.size===ROWS*COLS)init();});

    calcLayout();init();
    function loop(){draw();requestAnimationFrame(loop)}
    loop();
    </script>
</body>
</html>
