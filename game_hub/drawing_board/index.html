<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🎨 绘画板 - Game Hub</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body{user-select:none}
        .game-wrapper{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px}
        .tools{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
        .color-pick{width:30px;height:30px;border:3px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
        .color-pick.active{border-color:var(--neon-yellow);box-shadow:0 3px 0 var(--ink),0 0 12px rgba(255,233,0,.6)}
        .tools span{color:var(--text-dim);font-size:13px}
        canvas{background:#FFF;cursor:crosshair}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back">← 返回首页</a>
        <span class="logo">🎨 绘画板</span>
    </nav>
    <div class="game-wrapper">
        <div class="tools">
            <button onclick="setTool('brush')" id="btn-brush" class="active">🖌 画笔</button>
            <button onclick="setTool('fill')" id="btn-fill">🪣 填充</button>
            <button onclick="setTool('rect')" id="btn-rect">⬜ 矩形</button>
            <button onclick="setTool('circle')" id="btn-circle">⭕ 圆形</button>
            <button onclick="setTool('eraser')" id="btn-eraser">🧹 橡皮</button>
            <span>|</span>
            <span>粗细</span>
            <input type="range" id="brushSize" min="1" max="30" value="4" oninput="brushSize=this.value">
            <span id="sizeLabel">4px</span>
            <span>|</span>
            <button onclick="setColor('#000')" class="color-pick active" id="c-black" style="background:#000"></button>
            <button onclick="setColor('#E04040')" class="color-pick" id="c-red" style="background:#E04040"></button>
            <button onclick="setColor('#FF8C00')" class="color-pick" id="c-orange" style="background:#FF8C00"></button>
            <button onclick="setColor('#4ECDC4')" class="color-pick" id="c-teal" style="background:#4ECDC4"></button>
            <button onclick="setColor('#667eea')" class="color-pick" id="c-blue" style="background:#667eea"></button>
            <button onclick="setColor('#A78BFA')" class="color-pick" id="c-purple" style="background:#A78BFA"></button>
            <button onclick="setColor('#34D399')" class="color-pick" id="c-green" style="background:#34D399"></button>
            <span>|</span>
            <button onclick="undoStroke()">↩ 撤销</button>
            <button onclick="clearCanvas()">🗑 清空</button>
            <button onclick="saveImage()">💾 保存</button>
        </div>
        <canvas id="game" width="680" height="460"></canvas>
    </div>
    <footer class="footer">按住鼠标画线 &nbsp;|&nbsp; 支持触摸屏 &nbsp;|&nbsp; Game Hub</footer>
    <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
    let drawing=false,brushSize=4,brushColor="#000",toolMode="brush";
    let strokes=[],currentStroke=null,shapeStart=null;

    ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);

    function setTool(t){
        toolMode=t;
        document.querySelectorAll(".tools button").forEach(b=>b.classList.remove("active"));
        document.getElementById("btn-"+t).classList.add("active");
    }

    function setColor(c){
        brushColor=c;
        document.querySelectorAll(".color-pick").forEach(b=>b.classList.remove("active"));
        document.getElementById("c-"+{["#000"]:"black",["#E04040"]:"red",["#FF8C00"]:"orange",["#4ECDC4"]:"teal",["#667eea"]:"blue",["#A78BFA"]:"purple",["#34D399"]:"green"}[c]).classList.add("active");
    }

    function clearCanvas(){ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);strokes=[];}
    function undoStroke(){strokes.pop();redrawAll();}

    // ===== 颜料桶（扫描线 Flood Fill，不卡顿） =====
    function floodFill(sx,sy,fillColor){
        let imgData=ctx.getImageData(0,0,680,460);
        let data=imgData.data,w=680,h=460;
        let i=(sy*w+sx)*4;
        let oR=data[i],oG=data[i+1],oB=data[i+2];
        let fc=hexToRgb(fillColor);
        if(oR===fc.r&&oG===fc.g&&oB===fc.b)return;

        let stack=[[sx,sy]],maxIter=150000,iter=0;
        while(stack.length>0&&iter<maxIter){
            let [x,y]=stack.pop();iter++;
            if(x<0||x>=w||y<0||y>=h)continue;
            let idx=(y*w+x)*4;

            // 找该行左右边界
            let L=x,R=x;
            while(L>0&&data[((y)*w+L-1)*4]===oR&&data[((y)*w+L-1)*4+1]===oG&&data[((y)*w+L-1)*4+2]===oB)L--;
            while(R<w-1&&data[((y)*w+R+1)*4]===oR&&data[((y)*w+R+1)*4+1]===oG&&data[((y)*w+R+1)*4+2]===oB)R++;

            // 填充该行
            for(let xx=L;xx<=R;xx++){
                let ii=(y*w+xx)*4;data[ii]=fc.r;data[ii+1]=fc.g;data[ii+2]=fc.b;data[ii+3]=255;
            }

            // 扫描上下行找新种子
            for(let yy=y-1;yy<=y+1;yy+=2){
                if(yy<0||yy>=h)continue;
                let xx=L;
                while(xx<=R){
                    while(xx<=R&&data[(yy*w+xx)*4]===fc.r&&data[(yy*w+xx)*4+1]===fc.g&&data[(yy*w+xx)*4+2]===fc.b)xx++;
                    if(xx>R)break;
                    if(data[(yy*w+xx)*4]===oR&&data[(yy*w+xx)*4+1]===oG&&data[(yy*w+xx)*4+2]===oB){stack.push([xx,yy])}
                    xx++;
                }
            }
        }
        ctx.putImageData(imgData,0,0);
    }

    function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)}}

    // ===== 重绘 =====
    function redrawAll(){
        ctx.fillStyle="#FFF";ctx.fillRect(0,0,680,460);
        for(let s of strokes){
            if(s.type==="free"){
                if(s.points.length<2)continue;
                ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap="round";ctx.lineJoin="round";
                ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
                for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.stroke();
            }else if(s.type==="rect"){
                ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap="square";
                ctx.strokeRect(s.x,s.y,s.w,s.h);
            }else if(s.type==="circle"){
                ctx.strokeStyle=s.color;ctx.lineWidth=s.size;
                ctx.beginPath();ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);ctx.stroke();
            }else if(s.type==="fill"){
                floodFill(s.x,s.y,s.color);
            }
        }
    }

    function saveImage(){let a=document.createElement("a");a.download="我的画.png";a.href=canvas.toDataURL();a.click();}

    function getPos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

    // ===== 鼠标事件 =====
    canvas.addEventListener("mousedown",e=>{
        drawing=true;let p=getPos(e);
        if(toolMode==="fill"){floodFill(Math.floor(p.x),Math.floor(p.y),brushColor);
            strokes.push({type:"fill",x:Math.floor(p.x),y:Math.floor(p.y),color:brushColor});drawing=false;return}
        if(toolMode==="brush"||toolMode==="eraser"){
            let c=toolMode==="eraser"?"#FFF":brushColor;
            let s=toolMode==="eraser"?brushSize*3:brushSize;
            currentStroke={type:"free",points:[p],color:c,size:s};strokes.push(currentStroke)}
        else{shapeStart=p;currentStroke=null}
    });

    canvas.addEventListener("mousemove",e=>{
        if(!drawing)return;let p=getPos(e);
        if((toolMode==="brush"||toolMode==="eraser")&&currentStroke){
            currentStroke.points.push(p);
            let pts=currentStroke.points;if(pts.length<2)return;
            ctx.strokeStyle=currentStroke.color;ctx.lineWidth=currentStroke.size;ctx.lineCap="round";ctx.lineJoin="round";
            ctx.beginPath();ctx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);ctx.lineTo(p.x,p.y);ctx.stroke();
        }else if(toolMode==="rect"||toolMode==="circle"){
            redrawAll(); // 重绘 + 预览
            ctx.strokeStyle=brushColor;ctx.lineWidth=brushSize;ctx.setLineDash([6,4]);
            if(toolMode==="rect")ctx.strokeRect(shapeStart.x,shapeStart.y,p.x-shapeStart.x,p.y-shapeStart.y);
            else{let r=Math.hypot(p.x-shapeStart.x,p.y-shapeStart.y);ctx.beginPath();ctx.arc(shapeStart.x,shapeStart.y,r,0,Math.PI*2);ctx.stroke()}
            ctx.setLineDash([]);
        }
    });

    canvas.addEventListener("mouseup",e=>{
        if(!drawing)return;drawing=false;
        if((toolMode==="rect"||toolMode==="circle")&&shapeStart){
            let p=getPos(e);
            if(toolMode==="rect"){let w=p.x-shapeStart.x,h=p.y-shapeStart.y;
                strokes.push({type:"rect",x:shapeStart.x,y:shapeStart.y,w,h,color:brushColor,size:brushSize})}
            else{let r=Math.hypot(p.x-shapeStart.x,p.y-shapeStart.y);
                strokes.push({type:"circle",cx:shapeStart.x,cy:shapeStart.y,r,color:brushColor,size:brushSize})}
            shapeStart=null;redrawAll();
        }
    });
    canvas.addEventListener("mouseleave",()=>{if(drawing){drawing=false;if(shapeStart){shapeStart=null;redrawAll()}}});

    // 触摸
    canvas.addEventListener("touchstart",e=>{e.preventDefault();let t=e.touches[0];canvas.dispatchEvent(new MouseEvent("mousedown",{clientX:t.clientX,clientY:t.clientY}))});
    canvas.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches[0];canvas.dispatchEvent(new MouseEvent("mousemove",{clientX:t.clientX,clientY:t.clientY}))});
    canvas.addEventListener("touchend",e=>{canvas.dispatchEvent(new MouseEvent("mouseup"))});

    document.getElementById("brushSize").addEventListener("input",function(){document.getElementById("sizeLabel").textContent=this.value+"px"});
    </script>
</body>
</html>
