<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>🎈 戳泡泡 - Game Hub</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body { display:flex; flex-direction:column; user-select:none; cursor:pointer; overflow:hidden; }
        .game-wrapper { flex:1; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="back">← 返回首页</a>
        <span class="logo">🎈 戳泡泡</span>
    </nav>
    <div class="game-wrapper"><canvas id="game" width="480" height="620"></canvas></div>
    <footer class="footer">点击泡泡戳破它！&nbsp;|&nbsp; 适合小朋友 &nbsp;|&nbsp; Game Hub</footer>
    <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
    const W=480,H=620, COLORS=["#FF6B6B","#4ECDC4","#FFE66D","#A78BFA","#FB923C","#34D399","#F472B6","#60A5FA"];

    let bubbles=[], score=0, combo=0, comboTimer=0;
    let particles=[];

    const ac=new (window.AudioContext||window.webkitAudioContext)();
    function beep(f,d,t="sine",v=0.08){
        let o=ac.createOscillator(),g=ac.createGain();
        o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);
        g.gain.setValueAtTime(v,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);
        o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
    }

    function spawnBubble(){
        if(bubbles.length>25) return;
        let r=20+Math.random()*35;
        bubbles.push({
            x:r+Math.random()*(W-2*r), y:H+r, r:r,
            color:COLORS[Math.floor(Math.random()*COLORS.length)],
            vx:(Math.random()-0.5)*0.8, vy:-(1+Math.random()*2.5),
            life:200+Math.random()*100
        });
    }

    canvas.addEventListener("click",e=>{
        let rect=canvas.getBoundingClientRect();
        let mx=e.clientX-rect.left, my=e.clientY-rect.top;
        for(let i=bubbles.length-1;i>=0;i--){
            let b=bubbles[i];
            if(Math.hypot(mx-b.x,my-b.y)<b.r+5){
                // 粒子爆炸
                for(let j=0;j<12;j++){
                    let angle=Math.random()*Math.PI*2, spd=2+Math.random()*6;
                    particles.push({x:b.x,y:b.y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
                        color:b.color,life:15+Math.random()*15,r:2+Math.random()*4});
                }
                bubbles.splice(i,1);
                combo++;comboTimer=40;
                let pts=combo>=5?combo*3:1;
                score+=pts;
                // 音效：连击越多音调越高
                beep(300+combo*100,0.06,"sine",0.06);
                break;
            }
        }
    });

    function draw(){
        ctx.fillStyle="#1a1a3e";
        let grad=ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0,"#0f0c29");grad.addColorStop(0.5,"#1a1a3e");grad.addColorStop(1,"#16213e");
        ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

        // 泡泡
        for(let b of bubbles){
            // 光泽
            let g=ctx.createRadialGradient(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.1,b.x,b.y,b.r);
            g.addColorStop(0,"rgba(255,255,255,0.5)");g.addColorStop(0.6,b.color);g.addColorStop(1,"rgba(0,0,0,0.2)");
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=1.5;
            ctx.stroke();
            // 高光点
            ctx.fillStyle="rgba(255,255,255,0.6)";
            ctx.beginPath();ctx.arc(b.x-b.r*0.25,b.y-b.r*0.3,b.r*0.15,0,Math.PI*2);ctx.fill();
        }

        // 粒子
        for(let p of particles){
            ctx.fillStyle=p.color.replace(")","")+","+p.life/30+")";
            ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
        }

        // 连击显示
        if(combo>=3&&comboTimer>0){
            ctx.fillStyle="rgba(255,255,100,"+comboTimer/40+")";ctx.font="bold 40px Microsoft YaHei";
            ctx.textAlign="center";
            ctx.fillText("🔥 x"+combo+" 连击！",W/2,H/2);
        }

        ctx.fillStyle="#FFF";ctx.font="bold 20px Microsoft YaHei";ctx.textAlign="left";
        ctx.fillText("💥 "+score,15,35);
        ctx.font="13px Microsoft YaHei";ctx.fillStyle="rgba(255,255,255,0.4)";
        ctx.fillText("连击5次以上得分翻倍！",15,55);
    }

    function update(){
        // 生成泡泡
        if(Math.random()<0.03) spawnBubble();
        for(let b of bubbles){b.x+=b.vx;b.y+=b.vy;b.life--;}
        bubbles=bubbles.filter(b=>b.life>0&&b.y+b.r>0&&b.x+b.r>0&&b.x-b.r<W);

        for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;}
        particles=particles.filter(p=>p.life>0);

        if(comboTimer>0)comboTimer--;else combo=0;
    }

    function loop(){update();draw();requestAnimationFrame(loop);}
    loop();
    </script>
</body>
</html>
